# render.yaml — AnvayaAI Supply Chain Platform
# Native runtimes (Python + Node) — simpler & faster than Docker on Render free tier
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── 1. FastAPI Backend ────────────────────────────────────────────────────
  - type: web
    name: anvayaai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHON_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true

  # ── 2. Next.js Frontend ──────────────────────────────────────────────────
  - type: web
    name: anvayaai-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      - key: NODE_ENV
        value: production
      # ⚠️ After first deploy, replace with your actual backend Render URL:
      # e.g. https://anvayaai-backend.onrender.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://anvayaai-backend.onrender.com
    healthCheckPath: /
    autoDeploy: true
